# Окружение для разработки: docker compose up --build
# Порт сайта можно сменить: WEB_PORT=8765 docker compose up
# (на Windows порт 8000 иногда зарезервирован системой)

x-app: &app
  build:
    context: .
    target: dev
  env_file: .env
  volumes:
    - .:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    <<: *app
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "${WEB_PORT:-8000}:8000"

  celery:
    <<: *app
    command: celery -A config worker -l info

  celery-beat:
    <<: *app
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule

volumes:
  postgres_data:
