[project]
name = "restaurant-system"
version = "0.1.0"
description = "Система управления рестораном: меню, бронирование, заказы, кухня в реальном времени"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "DJ",   # django
    "SIM",  # simplify
    "S",    # bandit (безопасность)
]

[tool.ruff.lint.per-file-ignores]
"config/settings/*" = ["F403", "F405"]
"**/tests/*" = ["S101", "S105", "S106"]
"conftest.py" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["apps", "tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["apps", "config"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "config/settings/*",
    "config/asgi.py",
    "config/wsgi.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
