<div class="field{% if field.errors %} field--error{% endif %}">
  <label class="field__label" for="{{ field.id_for_label }}">{{ field.label }}{% if not field.field.required and not hide_optional %} <span class="field__optional">(необязательно)</span>{% endif %}</label>
  {% if min or max %}
    <input type="date" name="{{ field.html_name }}" id="{{ field.id_for_label }}"
           value="{{ field.value|stringformat:'s'|default:'' }}" min="{{ min }}" max="{{ max }}" required>
  {% else %}
    {{ field }}
  {% endif %}
  {% if field.help_text %}<p class="field__help">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="field__error">{{ error }}</p>{% endfor %}
</div>
