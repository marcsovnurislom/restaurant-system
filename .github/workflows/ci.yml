name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.13"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: restaurant
          POSTGRES_USER: restaurant
          POSTGRES_PASSWORD: restaurant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restaurant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://restaurant:restaurant@localhost:5432/restaurant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: Все изменения моделей покрыты миграциями
        run: python manage.py makemigrations --check --dry-run
      - name: Проверка настроек для продакшена
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-only-secret-key-that-is-long-enough-to-pass-the-deploy-check-1234567890
          DJANGO_ALLOWED_HOSTS: example.com
      - run: pytest --cov --cov-report=term-missing --cov-fail-under=70
